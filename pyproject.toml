[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wellfit"
version = "0.2.0"
description = "Effective chi2 for correlated data, systematic error floors, group tension and bootstrap errors, for grid and optimizer fits"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]
authors = [{ name = "Alex Laroche" }]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["wellfit"]
